  # ========== BACKEND ==========
  - type: web
    name: ticket-booking-backend
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Server
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      
      # Database - Using Neon PostgreSQL
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_EH3asWBYwm6X@ep-autumn-morning-aybxs4oo.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      -
      # JWT
      - key: JWT_SECRET
        value: your_super_secret_jwt_key_here
      - key: JWT_EXPIRE
        value: 7d
      
      # Email (Gmail)
      - key: EMAIL_USER
        value: biswajit08paul1@gmail.com
      - key: EMAIL_PASS
        value: lnjr tdmp hydn iocy
      
      # OTP (Twilio)
      - key: TWILIO_SID
        value: AC8427d33428efaed08b931d6c0a99cfa8
      - key: TWILIO_AUTH_TOKEN
        value: e7e601795d3e33589793d1ff1ec98734
      - key: TWILIO_PHONE
        value: +17372508034
      
      # Frontend URL - Will be updated after frontend deploys
      - key: FRONTEND_URL
        value: https://ticket-booking-frontend.onrender.com
      
      # QR Code
      - key: QR_CODE_URL
        value: https://ticket-booking-backend.onrender.com/api/verify

  # ========== FRONTEND ==========
  - type: web
    name: ticket-booking-frontend
    plan: free
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build -l 3000
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: ticket-booking-backend
          type: web
          property: host
      - key: REACT_APP_SOCKET_URL
        fromService:
          name: ticket-booking-backend
          type: web
          property: host

databases:
  - name: ticket-db
    plan: free