services:
  # ========== BACKEND ==========
  - type: web
    name: ticket-booking-backend
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      
      # Database - Using Neon PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-db
          property: connectionString
      
      # JWT - Generate automatically
      - key: JWT_SECRET
        generateValue: true
      
      - key: JWT_EXPIRE
        value: 7d
      
      # Email - Set in Render Dashboard
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      
      # Twilio - Set in Render Dashboard
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE
        sync: false
      
      # Frontend URL - Will be updated after frontend deploys
      - key: FRONTEND_URL
        sync: false
      
      - key: QR_CODE_URL
        sync: false

  # ========== FRONTEND ==========
  - type: web
    name: ticket-booking-frontend
    plan: free
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build -l 3000
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: ticket-booking-backend
          type: web
          property: host
      - key: REACT_APP_SOCKET_URL
        fromService:
          name: ticket-booking-backend
          type: web
          property: host

databases:
  - name: ticket-db
    plan: free
    databaseName: ticket_booking_db
    user: postgres
    ipAllowList: []