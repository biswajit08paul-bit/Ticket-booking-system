services:
  # ========== BACKEND ==========
  - type: web
    name: ticket-booking-backend
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: postgresql://your_username:your_password@your_host:5432/your_database
      - key: JWT_SECRET
        value: your_jwt_secret_key_here
      - key: JWT_EXPIRE
        value: 7d
      - key: EMAIL_USER
        value: your_email@gmail.com
      - key: EMAIL_PASS
        value: your_gmail_app_password
      - key: FRONTEND_URL
        value: https://ticket-booking-frontend.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

  # ========== FRONTEND ==========
  - type: web
    name: ticket-booking-frontend
    plan: free
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build -l 3000
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: ticket-booking-backend
          type: web
          property: host
      - key: REACT_APP_SOCKET_URL
        fromService:
          name: ticket-booking-backend
          type: web
          property: host